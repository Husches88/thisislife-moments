<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THIS IS LIFE — Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="panel login">
  <div class="brand">THIS IS LIFE<span>®</span></div>
  <h1>Admin</h1>
  <p>Fotos verwalten</p>
  <form id="loginForm">
    <input id="password" type="password" placeholder="Admin-Passwort" required>
    <button>Anmelden</button>
    <div id="loginError"></div>
  </form>
</div>

<div id="app" hidden>
<header>
  <div><div class="brand">THIS IS LIFE<span>®</span></div><h1>Admin</h1></div>
  <div><button id="githubTest" class="ghost">GitHub-Verbindung testen</button> <button id="logout" class="ghost">Abmelden</button></div>
</header>

<section class="panel">
  <h2>Fotos hochladen</h2>
  <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple>
  <div class="row">
    <input id="title" placeholder="Titel (optional)">
    <input id="category" placeholder="Kategorie" value="MOMENT">
    <label><input id="hero" type="checkbox"> Als Titelbild</label>
  </div>
  <button id="upload">Bilder hochladen</button>
  <p class="hint">Jede Datei max. 20 MB. Die Bilder werden direkt in dein GitHub-Repository hochgeladen.</p>
  <div id="uploadMsg"></div><pre id="githubTestResult" style="white-space:pre-wrap;margin-top:12px;color:#aaa"></pre>
</section>

<section class="panel">
  <div class="listHead"><h2>Galerie</h2><button id="refresh" class="ghost">Aktualisieren</button></div>
  <div id="items"></div>
</section>
</div>
<script src="admin.js"></script>
</body>
</html>
